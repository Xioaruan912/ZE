<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f5;color:#213d4e;font-family:Segoe UI,Microsoft YaHei,sans-serif}main{background:#fff;padding:36px;border-radius:12px;width:min(360px,calc(100vw - 100px));box-shadow:0 12px 40px #153b4a18}h1{font-size:24px;margin:0 0 8px}p{color:#708490;font-size:14px;margin-bottom:24px}label{display:block;font-size:14px;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd9df;border-radius:6px;font-size:16px}button{width:100%;border:0;border-radius:6px;padding:12px;margin-top:16px;background:#183b51;color:white;font-size:16px}#error{color:#a33131;min-height:1.4em}</style><!--ZE:styles--><link rel="stylesheet" href="/assets/ze-ui-QZGXJDKU.css"><link rel="icon" type="image/svg+xml" href="/assets/book-open-text-XDBR4GQH.svg"><!--/ZE:styles--></head><body class="ze-login"><main><h1>ZE</h1><p>输入口令，继续阅读。</p><form id="login"><label for="password">访问口令</label><input type="password" id="password" autocomplete="current-password" required autofocus><button type="submit">进入 ZE</button><p id="error" role="alert"></p></form><a href="https://github.com/Xioaruan912/ZE" target="_blank" rel="noopener noreferrer" style="font-size:13px;color:inherit">GitHub 源码 · AGPL-3.0</a></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();let error=document.getElementById('error');error.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});let data=await r.json();if(!r.ok)throw new Error(data.error);location.reload()}catch(e){error.textContent=e.message}})</script><!--ZE:scripts--><script type="module" src="/assets/ze-ui-7GGGEFTK.js"></script><!--/ZE:scripts--></body></html>
