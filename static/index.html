<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZE</title><link rel="stylesheet" href="/viewer.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/popovers.css"><link rel="stylesheet" href="/reading-tools.css"><link rel="stylesheet" href="/reader-extras.css"><!--ZE:styles--><link rel="stylesheet" href="/assets/ze-ui-QZGXJDKU.css"><link rel="icon" type="image/svg+xml" href="/assets/book-open-text-XDBR4GQH.svg"><!--/ZE:styles--></head><body>
<header><button id="menu" aria-label="收起文献列表" aria-controls="library" aria-expanded="true">☰</button><strong aria-label="ZE"><a href="https://github.com/Xioaruan912/ZE" target="_blank" rel="noopener noreferrer" title="ZE 使用说明与源码" style="color:inherit;text-decoration:none">ZE</a></strong><span id="status">连接中</span><button id="show-plan">阅读计划</button><button id="sync-now" title="立即将缓存的标注同步到 Zotero">立即同步</button><button id="refresh" title="刷新文献库、分类和阅读计划">刷新文献</button></header>
<div id="zotero-notice" role="status" hidden></div>
<main><aside id="library" aria-label="文献库"></aside>
<section class="workspace"><div id="reading-tabs" role="tablist" aria-label="已打开的论文" hidden></div><div id="welcome"><div class="welcome-icon">▤</div><h2>打开一篇论文</h2><p>选择左侧的文献，从上次阅读的位置继续。</p></div><div id="reader" hidden><div class="toolbar"><button id="back" aria-label="返回文献列表">‹</button><div class="paper-title" id="title"></div><button id="nav-back" aria-label="返回上一阅读位置" disabled>↶</button><button id="nav-forward" aria-label="前进到下一阅读位置" disabled>↷</button><button id="show-navigation">导航</button><button id="prev" aria-label="上一页">‹</button><label><input id="page" aria-label="页码" inputmode="numeric" type="number" min="1"> / <span id="pages">0</span></label><button id="next" aria-label="下一页">›</button><button id="zoomout" aria-label="缩小">−</button><button id="zoomin" aria-label="放大">＋</button><select id="zoom-mode" aria-label="页面缩放"><option value="width">适合宽度</option><option value="page">整页</option><option value="manual">手动缩放</option></select><span id="zoom-value" aria-live="polite"></span><select id="mark-tool" aria-label="阅读工具"><option value="select">划词翻译</option><option value="highlight">连续高亮</option><option value="underline">连续下划线</option></select><select id="tool-color" aria-label="连续标注颜色"><option value="#ffd400">黄色</option><option value="#ff6666">红色</option><option value="#5fb236">绿色</option><option value="#2ea8e5">蓝色</option><option value="#a28ae5">紫色</option><option value="#e56eee">粉色</option><option value="#f19837">橙色</option><option value="#aaaaaa">灰色</option></select><button id="touch-select" aria-label="切换手指拖动划词" aria-pressed="false" title="Apple Pencil 可直接拖选；开启后手指也可拖选，关闭后手指用于滚动">手指划词</button><button id="show-notes">标注</button></div><div id="pdf-revision-notice" role="status" hidden></div><div id="document" aria-label="论文阅读区域"><div id="pages-container"></div></div></div></section>
<aside id="panel" hidden><div class="panel-title"><h2>阅读助手</h2><button id="close-panel" aria-label="关闭">×</button></div><div id="panel-content"></div></aside></main>
<div id="selection-actions" class="reader-popover" data-mode="selection" role="dialog" aria-label="划词与批注" hidden><div class="popover-content">
<div class="annotation-header for-annotation"><span id="annotation-type" class="annotation-type" aria-hidden="true">A</span><strong id="annotation-page">页 1</strong><div id="annotation-actions" role="group" aria-label="标注快捷操作"><button id="change-annotation-color" aria-expanded="false" aria-controls="selection-palette">更改颜色</button><button id="copy-annotation">复制原文</button><button id="delete-annotation" class="danger">删除标注</button></div></div>
<div id="selection-palette" class="color-row" role="group" aria-label="选择标注颜色"><button class="swatch" data-color="#ffd400" aria-label="黄色" title="黄色"></button><button class="swatch" data-color="#ff6666" aria-label="红色" title="红色"></button><button class="swatch" data-color="#5fb236" aria-label="绿色" title="绿色"></button><button class="swatch" data-color="#2ea8e5" aria-label="蓝色" title="蓝色"></button><button class="swatch" data-color="#a28ae5" aria-label="紫色" title="紫色"></button><button class="swatch" data-color="#e56eee" aria-label="粉色" title="粉色"></button><button class="swatch" data-color="#f19837" aria-label="橙色" title="橙色"></button><button class="swatch ink-only" data-color="#000000" aria-label="黑色" title="黑色"></button><button class="swatch" data-color="#aaaaaa" aria-label="灰色" title="灰色"></button></div>
<div class="selection-buttons for-selection" role="group" aria-label="标注方式"><button id="mark-mode" aria-label="高亮" aria-pressed="true" title="高亮"><span class="mode-highlight">A</span></button><button id="underline-mode" aria-label="下划线" aria-pressed="false" title="下划线"><span class="mode-underline">A</span></button><button id="copy-selection" aria-label="复制原文" title="复制原文">⧉</button></div>
<div class="selection-translation for-selection"><textarea id="translation-text" aria-label="译文" placeholder="译文将在这里显示"></textarea><div class="translate-header"><select id="translation-service" aria-label="翻译服务"><option value="cnki">CNKI</option><option value="google">Google 翻译</option><option value="microsoft">微软翻译</option></select><span id="translation-state" role="status">选中文字后自动翻译</span></div></div>
<div id="conflict-details" class="for-annotation" hidden><strong>检测到同步冲突，已暂停覆盖</strong><p>本地内容保留在下方编辑框。网页草稿：</p><pre id="conflict-draft"></pre><button id="append-conflict">追加网页草稿到本地批注</button><button id="keep-local-conflict">保留本地版本</button><button id="save-resolved-conflict">采用编辑后的内容</button></div><textarea id="annotation-comment" class="for-annotation" aria-label="批注" placeholder="添加批注…"></textarea><div id="annotation-tags" class="for-annotation"><div id="annotation-tag-chips"></div><div id="annotation-tag-presets"></div><input id="annotation-tag-input" aria-label="添加批注标签" placeholder="输入标签后按回车" maxlength="100"></div><div class="annotation-footer for-annotation"><span id="annotation-save-state" role="status">批注会自动保存</span></div>
</div></div><div id="toast" role="status"></div><script type="module" src="/app.js?v=20261028-2"></script><!--ZE:scripts--><script type="module" src="/assets/ze-ui-7GGGEFTK.js"></script><!--/ZE:scripts--></body></html>
