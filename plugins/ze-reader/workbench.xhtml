<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8"/><title>ZE Reader</title><link rel="stylesheet" href="chrome://ze-reader/content/workbench.css"/><link rel="localization" href="chrome://ze-reader/locale/ze-reader.ftl"/><script src="chrome://ze-reader/content/workbench.js" defer="defer"></script></head>
<body class="ze-workspace">
<header><div><h1 data-l10n-id="ze-reader-title">ZE Reader</h1><p class="ze-muted">阅读现场 · 笔记与标注 · 文献比较</p></div><button id="ze-open-settings" type="button">翻译设置</button></header>
<nav aria-label="工作台视图"><button id="view-tabs" type="button" aria-pressed="true">标签页</button><button id="view-notes" type="button" aria-pressed="false">笔记与标注</button><button id="view-matrix" type="button" aria-pressed="false">文献矩阵</button></nav>
<div class="ze-toolbar"><label>文献范围 <select id="ze-scope"><option value="selected">所选文献</option><option value="current">当前列表</option></select></label><button id="ze-refresh" type="button">刷新</button><label class="ze-search">搜索 <input id="ze-query" type="search" placeholder="搜索标题或内容"/></label></div>
<p id="ze-count" role="status" class="ze-muted">正在读取…</p><p id="ze-message" role="status" aria-live="polite"></p>
<main>
<section id="pane-tabs"><div class="ze-columns"><div><h2>已打开的 PDF</h2><p class="ze-muted">点击标题回到 Zotero 标签页。</p><div id="ze-tabs"></div></div><div><h2>阅读分组</h2><p class="ze-muted">保存当前 PDF 集合，下次补开尚未打开的文献。分组保存在本机。</p><label>分组名称 <input id="ze-group-name" placeholder="如 ABE 安全证明"/></label><div class="ze-actions"><button id="ze-save-group" type="button">保存当前标签页</button></div><label>已保存分组 <select id="ze-group-list"><option value="">选择分组</option></select></label><div class="ze-actions"><button id="ze-restore-group" type="button">恢复</button><button id="ze-rename-group" type="button">使用新名称</button><button id="ze-delete-group" type="button">删除分组</button></div><button id="ze-group-reset" type="button" hidden="hidden">重建本机分组配置</button></div></div></section>
<section id="pane-notes" hidden="hidden"><h2>笔记与标注</h2><div class="ze-toolbar"><label>类型 <select id="ze-kind"><option value="">全部</option><option value="annotation">标注</option><option value="note">笔记</option></select></label><label>颜色 <select id="ze-color"><option value="">全部</option></select></label><label>标签 <select id="ze-tag"><option value="">全部</option></select></label></div><div id="ze-records"></div><div class="ze-actions"><button id="ze-prev" type="button">上一页</button><span id="ze-page" role="status"></span><button id="ze-next" type="button">下一页</button></div></section>
<section id="pane-matrix" hidden="hidden"><h2>文献矩阵</h2><p class="ze-muted">每行一篇文献；每列按已有标注的颜色或精确标签归类。单元格保留原文与批注。</p><div id="ze-rules"></div><div class="ze-actions"><button id="ze-add-rule" type="button">添加列规则</button><button id="ze-save-rules" type="button">保存规则</button><button id="ze-rules-reset" type="button" hidden="hidden">重建本机矩阵配置</button><button id="ze-copy-matrix" type="button" disabled="disabled">复制 Markdown</button></div><div id="ze-matrix" class="ze-table-scroll"></div></section>
</main></body></html>
