<section xmlns="http://www.w3.org/1999/xhtml" class="ze-settings main-section">
<h2>翻译桥接</h2><p>将 ZE 网页阅读器连接到已安装的 Translate for Zotero。统一安装包不包含本机令牌。</p>
<p id="ze-bridge-status" role="status"></p><label for="ze-token">翻译令牌</label><input id="ze-token" type="password" autocomplete="off" placeholder="粘贴 bridge.token 的内容"/>
<div class="ze-actions"><button id="ze-save-token" type="button">保存令牌</button><button id="ze-import-token" type="button">导入 bridge.token</button><button id="ze-clear-token" type="button">清除令牌</button></div>
<p>选择现有 ZE 安装目录中的 bridge.token。配置仅保存在此电脑；其他电脑需要单独配置。请先停用旧的独立 Translate Bridge，再重新启用 ZE Reader。</p>
<h2>连接测试</h2><p>点击后将通过翻译插件发送测试短句：Hello world.</p><button id="ze-test-translation" type="button">测试翻译</button><p id="ze-settings-message" role="status" aria-live="polite"></p>
</section>
